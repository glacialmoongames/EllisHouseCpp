name: Build and publish console ports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/console-release.yml'
      - 'src/**'
      - 'assets/**'
      - '3ds/**'
      - 'psp/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ellis-house-console-release
  cancel-in-progress: true

env:
  RELEASE_TAG: v0.1.0-port-preview

jobs:
  psp:
    name: Build PSP package
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install asset preparation dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3 py3-pip py3-pillow py3-numpy libsndfile
            python3 -m pip install --break-system-packages --no-cache-dir soundfile
          else
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pil python3-numpy python3-soundfile
          fi
      - name: Prepare original assets and build optimized EBOOT
        run: |
          python3 psp/tools/prepare_assets.py
          make -C psp -j2
          python3 psp/tools/package.py
      - name: Package PSP/GAME layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root = Path.cwd()
          source = root / "EllisHousePSP"
          output = root / "EllisHouse-PSP.zip"
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in source.rglob("*"):
                  if path.is_file():
                      archive.write(path, Path("PSP/GAME/EllisHousePSP") / path.relative_to(source))
          print(output, output.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: psp-release
          path: EllisHouse-PSP.zip
          if-no-files-found: error
          compression-level: 0

  n3ds:
    name: Build Nintendo 3DS packages
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install asset preparation dependencies
        run: |
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3 py3-pillow py3-numpy py3-soundfile
          else
            apt-get update
            apt-get install -y --no-install-recommends python3 python3-pil python3-numpy python3-soundfile
          fi
      - name: Generate optimized ROMFS
        run: python3 3ds/tools/generate_assets.py .
      - name: Install CIA packaging tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl unzip tar
          mkdir -p /tmp/cia-tools/makerom /tmp/cia-tools/3dstool
          git clone --recurse-submodules https://github.com/diasurgical/bannertool.git /tmp/cia-tools/banner
          make -C /tmp/cia-tools/banner -j2
          git clone --depth 1 https://github.com/3DSGuy/Project_CTR.git /tmp/cia-tools/project-ctr
          make -C /tmp/cia-tools/project-ctr/makerom deps -j2
          make -C /tmp/cia-tools/project-ctr/makerom -j2
          curl -fL https://github.com/dnasdw/3dstool/releases/download/v1.2.6/3dstool_linux_x86_64.tar.gz -o /tmp/cia-tools/3dstool.tar.gz
          tar -xzf /tmp/cia-tools/3dstool.tar.gz -C /tmp/cia-tools/3dstool
          BANNER_PATH="$(find /tmp/cia-tools/banner -type f -name bannertool | head -n1)"
          MAKEROM_PATH="$(find /tmp/cia-tools/project-ctr/makerom -type f -name makerom | head -n1)"
          THREEDS_PATH="$(find /tmp/cia-tools/3dstool -type f -name 3dstool | head -n1)"
          test -n "$BANNER_PATH" && test -n "$MAKEROM_PATH" && test -n "$THREEDS_PATH"
          install -m 0755 "$BANNER_PATH" /usr/local/bin/bannertool
          # The release binary requests the standard Linux x86-64 loader path,
          # absent from the slim devkitPro image even though glibc is installed.
          mkdir -p /lib64
          ln -sf /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /lib64/ld-linux-x86-64.so.2
          install -m 0755 "$MAKEROM_PATH" /usr/local/bin/makerom
          install -m 0755 "$THREEDS_PATH" /usr/local/bin/3dstool
          bannertool --help >/dev/null || true
          makerom --help >/dev/null || true
          3dstool --help >/dev/null || true
      - name: Build 3DSX and CIA
        run: |
          make -C 3ds -j2
          make -C 3ds cia -j2
      - name: Package Homebrew Launcher layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, zipfile
          root = Path.cwd()
          stage = root / "_3dsx" / "3ds" / "EllisHouse3DS"
          stage.mkdir(parents=True, exist_ok=True)
          shutil.copy2(root / "EllisHouse3DS.3dsx", stage / "EllisHouse3DS.3dsx")
          with zipfile.ZipFile(root / "EllisHouse-3DSX.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in (root / "_3dsx").rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(root / "_3dsx"))
          shutil.copy2(root / "EllisHouse.cia", root / "EllisHouse-3DS.cia")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-release
          path: |
            EllisHouse-3DSX.zip
            EllisHouse-3DS.cia
          if-no-files-found: error
          compression-level: 0

  gba:
    name: Build Game Boy Advance ROM
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic asset tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-pil python3-numpy python3-soundfile
      - name: Generate assets and build optimized ROM
        run: |
          python3 gba/tools/generate_assets.py
          make -C gba -j2 PYTHON=python3
          cp ellis_house_gba.gba EllisHouse-GBA.gba
      - uses: actions/upload-artifact@v4
        with:
          name: gba-release
          path: EllisHouse-GBA.gba
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Replace GitHub release downloads
    needs: [psp, n3ds, gba]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          path: new
          merge-multiple: true
      - name: Upload updated PSP and 3DS builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" new/EllisHouse-PSP.zip new/EllisHouse-3DSX.zip new/EllisHouse-3DS.cia new/EllisHouse-GBA.gba --clobber --repo "$GITHUB_REPOSITORY"
      - name: Publish checksums for the updated console packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd new
          sha256sum EllisHouse-PSP.zip EllisHouse-3DSX.zip EllisHouse-3DS.cia EllisHouse-GBA.gba > SHA256-CONSOLES.txt
          gh release upload "$RELEASE_TAG" SHA256-CONSOLES.txt --clobber --repo "$GITHUB_REPOSITORY"
