<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Elli's House</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
    body{display:grid;place-items:center}
    canvas{width:min(100vw,calc(100vh * 1.76147));height:min(100vh,calc(100vw / 1.76147));image-rendering:pixelated;outline:0}
    #status{position:fixed;inset:auto 0 18px;text-align:center;color:#eee;font:14px Arial,sans-serif}
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
  <div id="status">Loading Elli's House…</div>
  <script>
    var buildId=new URLSearchParams(location.search).get('build')||'';
    var cacheSuffix=buildId?'?build='+encodeURIComponent(buildId):'';
    var Module={canvas:document.getElementById('canvas'),locateFile:function(path,prefix){
      return (prefix||'')+path+cacheSuffix;
    },setStatus:function(value){
      var status=document.getElementById('status');status.textContent=value||'';status.hidden=!value;
    }};
    addEventListener('keydown',function(event){
      if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.code)) event.preventDefault();
    },{capture:true,passive:false});
    addEventListener('click',function(){Module.canvas.focus()},{once:true});
  </script>
  <template id="game-script">{{{ SCRIPT }}}</template>
  <script>
    var generatedScript=document.getElementById('game-script').content.querySelector('script');
    var gameScript=document.createElement('script');
    gameScript.async=true;
    gameScript.src=generatedScript.getAttribute('src')+cacheSuffix;
    document.body.appendChild(gameScript);
  </script>
</body>
</html>
